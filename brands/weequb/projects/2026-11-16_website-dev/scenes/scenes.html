<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:M;src:url(../../../../../fonts/Montserrat-Variable.ttf);font-weight:100 900}
@font-face{font-family:I;src:url(../../../../../fonts/Inter-Variable.ttf);font-weight:100 900}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#111}
body{font-family:I,sans-serif;color:#fff}
#stage{position:absolute;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 35%,#252c3d 0%,#111 70%)}
.abs{position:absolute}
.phone{position:absolute;left:250px;top:230px;width:580px;height:1140px;border-radius:72px;background:#1a1d26;
  box-shadow:0 40px 120px rgba(0,0,0,.6),inset 0 0 0 3px #3a3f4d;padding:22px}
.screen{position:relative;width:100%;height:100%;border-radius:52px;overflow:hidden;background:#fff;color:#222}
.notch{position:absolute;left:50%;top:14px;width:150px;height:34px;margin-left:-75px;background:#1a1d26;border-radius:20px;z-index:9}
.url{position:absolute;left:0;right:0;top:0;height:110px;background:#f1f3f6;padding:62px 24px 0}
.url div{height:38px;border-radius:19px;background:#fff;border:1px solid #d6dae1;font:500 20px I;color:#555;padding:7px 18px}
.bar{position:absolute;left:0;top:110px;height:6px;background:#2f6bff}
.sk{position:absolute;background:#e6e9ee;border-radius:12px}
.spin{position:absolute;left:50%;top:520px;width:90px;height:90px;margin-left:-45px;border-radius:50%;
  border:10px solid #e1e5ec;border-top-color:#2f6bff}
.tap{position:absolute;width:120px;height:120px;border-radius:50%;border:6px solid rgba(255,255,255,.9);background:rgba(255,255,255,.25)}
.timer{position:absolute;left:50%;width:360px;margin-left:-180px;text-align:center;font:900 120px M;letter-spacing:2px}
.label{font:800 34px M;letter-spacing:6px;text-transform:uppercase}
.chip{position:absolute;padding:18px 30px;border-radius:44px;font:800 34px M;color:#111;background:#FFD400;white-space:nowrap}
.ring{position:absolute;width:280px;height:280px}
.ring svg{width:280px;height:280px;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:900 92px M;color:#fff}
.ring .cap{position:absolute;left:-20px;right:-20px;top:300px;text-align:center;font:700 28px M;color:#cfd5e2;letter-spacing:2px}
.notif{position:absolute;left:24px;right:24px;height:132px;border-radius:30px;background:rgba(255,255,255,.92);color:#111;
  padding:20px 24px 0 112px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.notif .ic{position:absolute;left:22px;top:24px;width:72px;height:72px;border-radius:18px;background:#FFD400;
  font:900 40px M;display:flex;align-items:center;justify-content:center;color:#111}
.notif b{display:block;font:800 26px I}
.notif span{display:block;font:500 24px I;color:#444;margin-top:6px}
</style></head>
<body><div id="stage"></div>
<script>
const LOGO='../../../assets/logo/logo.png';
const S=document.getElementById('stage');
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const io=(t,a,b)=>cl((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3);
const back=x=>{const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const L=(a,b,x)=>a+(b-a)*x;
function el(html){const d=document.createElement('div');d.innerHTML=html.trim();return d.firstChild}
function phone(inner){return el(`<div class="phone"><div class="notch"></div><div class="screen">${inner}</div></div>`)}
const loadingPage=`<div class="url"><div>yourshop.in</div></div><div class="bar" id="bar"></div>
 <div class="sk" style="left:30px;top:150px;width:200px;height:40px"></div>
 <div class="sk" style="left:30px;top:220px;width:476px;height:260px"></div>
 <div class="sk" style="left:30px;top:680px;width:420px;height:30px"></div>
 <div class="sk" style="left:30px;top:730px;width:340px;height:30px"></div>
 <div class="sk" style="left:30px;top:800px;width:226px;height:200px"></div>
 <div class="sk" style="left:280px;top:800px;width:226px;height:200px"></div>
 <div class="spin" id="spin"></div>`;

const scenes={
 // 1. hook: site stuck loading, impatient taps
 loading:{build(){S.append(phone(loadingPage));
   for(let i=0;i<3;i++)S.append(el(`<div class="tap" id="tap${i}"></div>`));},
  set(t){const p=S.querySelector('.phone');p.style.transform=`scale(${1+0.03*t})`;
   spin.style.transform=`rotate(${t*400}deg)`;bar.style.width=(8+6*t)+'%';
   S.querySelectorAll('.sk').forEach(s=>s.style.opacity=0.55+0.45*Math.abs(Math.sin(t*3)));
   [[0.15,520,700],[0.7,600,780],[1.25,480,640]].forEach(([at,x,y],i)=>{const k=io(t,at,at+0.45),e=document.getElementById('tap'+i);
     e.style.left=(x-60)+'px';e.style.top=(y-60)+'px';e.style.opacity=k>0&&k<1?1-k:0;e.style.transform=`scale(${0.5+k})`;});}},
 // 2. timer counts past 3 s, user swipes the site away
 bounce:{build(){S.append(phone(loadingPage));S.append(el(`<div class="timer" id="tm" style="top:640px"></div>`));},
  set(t){spin.style.transform=`rotate(${t*400}deg)`;bar.style.width=(17+3*t)+'%';
   const secs=Math.min(4,1+t*1.6);tm.textContent='0:0'+Math.floor(secs);
   tm.style.color=secs>=3?'#ff3b3b':'#fff';tm.style.transform=`scale(${secs>=3?1+0.12*Math.abs(Math.sin(t*14)):1})`;
   tm.style.textShadow='0 8px 30px rgba(0,0,0,.7)';
   const k=eo(io(t,1.55,2.2)),p=S.querySelector('.phone');
   p.style.transform=`translate(${k*260}px,${-k*1500}px) rotate(${k*14}deg)`;tm.style.opacity=1-k;}},
 // 3. not mobile-friendly: squashed desktop page + pinch, then buried in search
 mobile:{build(){S.append(phone(`<div class="url"><div>yourshop.in</div></div>
   <div id="pg" style="position:absolute;left:0;top:110px;width:1400px;transform-origin:0 0;background:#fff">
    <div style="background:#0033aa;color:#ff0;font:700 64px serif;padding:20px">YOUR SHOP - WELCOME TO OUR WEBSITE!!!</div>
    <div style="display:flex;gap:20px;padding:20px">${[1,2,3,4,5].map(i=>`<div style="width:260px;height:300px;background:#ccc;font:22px serif;padding:10px;color:#00e">Product ${i} - click here for details and price list</div>`).join('')}</div>
    <div style="font:18px serif;padding:20px;color:#333;columns:3">${'Lorem ipsum dolor sit amet, our shop has been serving customers since many years with best quality and lowest price. '.repeat(14)}</div></div>
   <div id="sr" style="position:absolute;left:18px;right:18px;bottom:24px;height:420px;border-radius:28px;background:#fff;box-shadow:0 -8px 40px rgba(0,0,0,.25);padding:26px">
    <div style="height:56px;border-radius:28px;border:2px solid #d6dae1;font:600 24px I;color:#333;padding:12px 22px">best shop near me</div>
    ${['Competitor A — Fast, mobile site','Competitor B — Order online','Competitor C — Open now'].map(x=>`<div style="margin-top:22px;font:700 24px I;color:#1a0dab">${x}</div><div style="font:500 18px I;color:#0a7a2f">competitor.in</div>`).join('')}
    <div style="position:absolute;right:26px;bottom:20px;font:800 22px I;color:#d33">yourshop.in → page 7</div></div>`));
   S.append(el(`<div class="tap" id="f1"></div>`));S.append(el(`<div class="tap" id="f2"></div>`));},
  set(t){const z=0.38+0.22*Math.sin(io(t,0.1,1.4)*Math.PI);pg.style.transform=`scale(${z})`;
   const d=40+110*Math.sin(io(t,0.1,1.4)*Math.PI),on=t<1.45?1:0;
   f1.style.left=(540-60-d)+'px';f1.style.top=(700-60-d*0.6)+'px';f2.style.left=(540-60+d)+'px';f2.style.top=(700-60+d*0.6)+'px';
   f1.style.opacity=f2.style.opacity=on;
   sr.style.transform=`translateY(${(1-eo(io(t,1.5,2.0)))*500}px)`;}},
 // 4. brand reveal
 reveal:{build(){S.append(el(`<div class="abs" id="circ" style="left:540px;top:820px;width:10px;height:10px;border-radius:50%;background:#FFD400"></div>`));
   S.append(el(`<img id="lg" src="${LOGO}" class="abs" style="left:390px;top:560px;width:300px;height:300px">`));
   S.append(el(`<div class="abs" id="wq" style="left:0;right:0;top:900px;text-align:center;font:900 150px M;color:#111;letter-spacing:4px">WEEQUB</div>`));
   S.append(el(`<div class="abs label" id="tc" style="left:0;right:0;top:1070px;text-align:center;color:#111">Technologies</div>`));},
  set(t){const r=eo(io(t,0,0.35))*2400;circ.style.transform=`translate(-50%,-50%)`;circ.style.width=circ.style.height=Math.max(10,r)+'px';
   const k=io(t,0.25,0.75);lg.style.transform=`scale(${k>0?back(k):0}) rotate(${(1-k)*-20}deg)`;
   const w=eo(io(t,0.5,0.9));wq.style.opacity=w;wq.style.transform=`translateY(${(1-w)*80}px) scale(${1+0.03*t})`;
   const c=eo(io(t,0.75,1.1));tc.style.opacity=c;}},
 // 5. before → after wipe, then the new site scrolls
 beforeafter:{build(){S.append(phone(`
   <div id="old" style="position:absolute;inset:0;background:#fff">
     <div style="background:#0033aa;color:#ff0;font:700 40px serif;padding:80px 20px 20px;text-align:center">WELCOME TO OUR WEBSITE!!!</div>
     <div style="font:26px serif;color:#00e;text-decoration:underline;padding:20px;line-height:1.7">Home | About Us | Products | Contact Us | Gallery | Downloads</div>
     <div style="margin:10px 20px;height:300px;background:repeating-linear-gradient(45deg,#ddd 0 20px,#bbb 20px 40px)"></div>
     <div style="font:22px serif;color:#333;padding:20px">Under construction... Best viewed in Internet Explorer 6. Call us for price.</div></div>
   <div id="new" style="position:absolute;inset:0;background:#111;overflow:hidden">
    <div id="nsc" style="position:absolute;left:0;right:0;top:0">
     <div style="padding:80px 30px 30px;display:flex;justify-content:space-between;align-items:center"><b style="font:900 30px M;color:#fff">YOURSHOP</b><span style="width:40px;height:4px;background:#fff;box-shadow:0 12px 0 #fff,0 -12px 0 #fff"></span></div>
     <div style="padding:30px;font:900 72px/1.02 M;color:#fff">Fresh.<br>Fast.<br><span style="color:#FFD400">Yours.</span></div>
     <div style="margin:10px 30px;display:inline-block;padding:20px 40px;border-radius:40px;background:#FFD400;color:#111;font:800 28px M">Shop now →</div>
     <div style="margin:40px 30px 0;height:320px;border-radius:30px;background:linear-gradient(135deg,#FFD400,#ff7a00)"></div>
     <div style="display:flex;gap:20px;padding:30px">${['#5b8cff','#2fd18a'].map(c=>`<div style="flex:1;height:260px;border-radius:26px;background:${c}"></div>`).join('')}</div>
     <div style="display:flex;gap:20px;padding:0 30px 30px">${['#ff5d8f','#FFD400'].map(c=>`<div style="flex:1;height:260px;border-radius:26px;background:${c}"></div>`).join('')}</div>
     <div style="margin:0 30px;padding:30px;border-radius:26px;background:#1d2433;font:700 28px M;color:#fff">★★★★★ Customers love it</div>
    </div></div>
   <div id="div" style="position:absolute;top:0;bottom:0;width:6px;background:#FFD400;box-shadow:0 0 20px #FFD400"></div>`));
   S.append(el(`<div class="abs label" id="lb" style="left:0;top:1390px;width:540px;text-align:center;color:#ff6b6b">Before</div>`));
   S.append(el(`<div class="abs label" id="la" style="left:540px;top:1390px;width:540px;text-align:center;color:#FFD400">After</div>`));},
  set(t){const w=eo(io(t,0.15,1.15)),W=536;
   document.getElementById('new').style.clipPath=`inset(0 ${(1-w)*100}% 0 0)`;div.style.left=(w*W-3)+'px';div.style.opacity=w<1?1:0;
   nsc.style.transform=`translateY(${-eo(io(t,1.4,3.0))*620}px)`;
   lb.style.opacity=1-io(t,1.0,1.3);la.style.opacity=io(t,0.3,0.6);
   S.querySelector('.phone').style.transform=`scale(${1+0.02*t})`;}},
 // 6. speed / mobile / SEO scores + feature chips
 score:{build(){const R=120,C=2*Math.PI*R;
   [['Speed',98,90],['Mobile',100,400],['SEO',96,710]].forEach(([n,v,x],i)=>S.append(el(`<div class="ring" style="left:${x}px;top:520px">
    <svg viewBox="0 0 280 280"><circle cx="140" cy="140" r="${R}" fill="none" stroke="#2a3040" stroke-width="22"/>
    <circle id="rc${i}" cx="140" cy="140" r="${R}" fill="none" stroke="#2fd18a" stroke-width="22" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg>
    <div class="num" id="rn${i}">0</div><div class="cap">${n.toUpperCase()}</div></div>`)));
   [['FAST',150],['MOBILE-FIRST',350],['SEO-READY',650]].forEach(([n,x],i)=>S.append(el(`<div class="chip" id="ch${i}" style="left:${[90,330,690][i]}px;top:1010px">${n}</div>`)));
   S.append(el(`<div class="abs label" id="st" style="left:0;right:0;top:380px;text-align:center;color:#cfd5e2">Your new website</div>`));},
  set(t){const C=2*Math.PI*120;[98,100,96].forEach((v,i)=>{const k=eo(io(t,0.1+i*0.25,1.1+i*0.25));
    document.getElementById('rc'+i).setAttribute('stroke-dashoffset',C*(1-k*v/100));document.getElementById('rn'+i).textContent=Math.round(k*v);});
   [0,1,2].forEach(i=>{const k=io(t,1.6+i*0.25,2.0+i*0.25),e=document.getElementById('ch'+i);e.style.transform=`scale(${k>0?back(k):0})`;});
   st.style.opacity=io(t,0,0.3);}},
 // 7. enquiries roll in
 enquiries:{build(){S.append(phone(`<div style="position:absolute;inset:0;background:linear-gradient(160deg,#2b3550,#141821)"></div>
   <div style="position:absolute;left:0;right:0;top:110px;text-align:center;font:300 130px I;color:#fff">10:24</div>
   <div style="position:absolute;left:0;right:0;top:270px;text-align:center;font:500 28px I;color:#cfd5e2">Monday, 16 November</div>
   <div id="nf"></div>`));
   S.append(el(`<div class="abs" id="cnt" style="left:0;right:0;top:110px;text-align:center"><span class="label" style="color:#cfd5e2">Enquiries this week</span><div id="cn" style="font:900 96px M;color:#FFD400">0</div></div>`));},
  set(t){const items=[['New enquiry','"Website price enna?"'],['Contact form','Callback requested'],['New order','Online order received'],['New enquiry','"Can we book a visit?"'],['Contact form','Quote requested']];
   const nf=document.getElementById('nf');if(!nf.children.length)items.forEach(([a,b])=>nf.append(el(`<div class="notif"><div class="ic">W</div><b>${a}</b><span>${b}</span></div>`)));
   const shown=[...nf.children];shown.forEach((n,i)=>{const at=0.2+i*0.65,k=io(t,at,at+0.35),later=shown.filter((_,j)=>j>i&&t>=0.2+j*0.65).length;
     n.style.top=(360+later*150)+'px';n.style.opacity=k;n.style.transform=`translateY(${(1-eo(k))*-60}px) scale(${0.9+0.1*eo(k)})`;
     n.style.transition='none';});
   const count=Math.min(5,Math.floor((t-0.2)/0.65)+1);cn.textContent='+'+Math.max(0,count*4+(t>0.2?0:0));
   S.querySelector('.phone').style.transform=`translateY(60px) scale(${1+0.02*t})`;}},
 // 8. end card: comment STORE
 end:{build(){S.style.background='radial-gradient(ellipse at 50% 45%,#252c3d 0%,#111 72%)';
   S.append(el(`<img id="lg" src="${LOGO}" class="abs" style="left:440px;top:330px;width:200px;height:200px">`));
   S.append(el(`<div class="abs" id="bub" style="left:390px;top:620px;width:300px;height:200px;border-radius:50px;background:#fff;color:#111;display:flex;align-items:center;justify-content:center;font:900 64px M">"STORE"
     <i style="position:absolute;left:60px;bottom:-40px;border:24px solid transparent;border-top:28px solid #fff;border-left:28px solid #fff"></i></div>`));
   S.append(el(`<div class="abs" id="ct" style="left:0;right:0;top:900px;text-align:center;font:900 112px M;color:#fff;letter-spacing:2px">COMMENT</div>`));
   S.append(el(`<div class="abs" id="st2" style="left:0;right:0;top:1020px;text-align:center;font:900 170px M;color:#FFD400">STORE</div>`));
   S.append(el(`<div class="abs label" id="fa" style="left:0;right:0;top:1230px;text-align:center;color:#fff">Free website audit</div>`));
   S.append(el(`<div class="abs" id="ar" style="left:510px;top:1330px;width:60px;height:60px;border-right:12px solid #FFD400;border-bottom:12px solid #FFD400"></div>`));},
  set(t){lg.style.opacity=io(t,0,0.3);const b=io(t,0.1,0.5);bub.style.transform=`scale(${b>0?back(b):0})`;
   const c=eo(io(t,0.3,0.6));ct.style.opacity=c;ct.style.transform=`translateY(${(1-c)*60}px)`;
   const s=io(t,0.5,0.9);st2.style.transform=`scale(${s>0?back(s):0})`;
   fa.style.opacity=io(t,0.9,1.2);ar.style.opacity=io(t,1.0,1.2);ar.style.transform=`translateY(${Math.abs(Math.sin(t*5))*24}px) rotate(45deg)`;}},
};
const name=new URLSearchParams(location.search).get('scene');
scenes[name].build();window.setT=t=>scenes[name].set(t);window.setT(0);
window.ready=Promise.all([document.fonts.ready,...[...document.images].map(i=>i.decode().catch(()=>{}))]);
</script></body></html>
